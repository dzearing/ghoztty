on:
  push:
    tags:
      - "v*"
  # Re-drive a release for an existing tag. A tag-push run is frozen against
  # the workflow file AT that tag, so a fix to this file can only be applied to
  # an already-pushed tag through a dispatch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.39.0"
        required: true
        type: string

name: Release

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A dispatch builds the named tag; a tag push builds what it pushed.
          ref: ${{ inputs.tag || github.ref }}

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - uses: mlugg/setup-zig@v2

      - name: Set release variables
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          ARCH=$(uname -m)
          echo "TAG=$TAG" >> $GITHUB_ENV
          DMG_NAME="Ghoztty-${VERSION}-${ARCH}.dmg"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Build macOS app
        env:
          # Public Google OAuth client id, baked into Info.plist
          # (GhosttyGoogleClientID) via the -Dgoogle-client-id build option so
          # the shipped app can start the relay-brokered sign-in. The
          # confidential client secret lives only on the relay, never here.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          zig build -Doptimize=ReleaseFast -Demit-macos-app -Dxcframework-target=native -Dversion-string="$VERSION" -Dgoogle-client-id="$GOOGLE_CLIENT_ID"

      - name: Verify release build mode
        run: |
          # Guard against ever publishing a Debug/ReleaseSafe build. Such a build
          # shows the in-app "You're running a debug build" warning and is much
          # slower. Assert the freshly built binary reports ReleaseFast before we
          # codesign, notarize, and ship it via the Sparkle appcast.
          APP="macos/build/ReleaseLocal/Ghoztty.app/Contents/MacOS/ghoztty"
          VERSION_OUT="$("$APP" +version)"
          echo "$VERSION_OUT"
          if ! echo "$VERSION_OUT" | grep -qE 'build mode[[:space:]]*:[[:space:]]*\.ReleaseFast'; then
            echo "::error::Refusing to release: built binary is not ReleaseFast (would ship a debug/safe build that shows the in-app debug warning and degrades performance)."
            exit 1
          fi
          echo "✅ Verified ReleaseFast build."

      - name: Embed ghoztty-agent
        run: |
          # The zig build embeds the session-persistence agent only into the
          # zig-out copy of the bundle (src/build/GhosttyXcodebuild.zig); the
          # DMG below packages the xcodebuild output, which does not get it.
          # Copy the agent in before codesign so the nested binary gets a
          # hardened-runtime signature and is covered by the bundle seal.
          # Without it session-persistence silently degrades to plain
          # non-persistent windows (v1.13.0 shipped that way).
          AGENT="zig-out/Ghoztty.app/Contents/MacOS/ghoztty-agent"
          if [ ! -x "$AGENT" ]; then
            echo "::error::ghoztty-agent missing from zig-out bundle; refusing to ship a release without session persistence."
            exit 1
          fi
          cp -f "$AGENT" "macos/build/ReleaseLocal/Ghoztty.app/Contents/MacOS/ghoztty-agent"
          echo "✅ Embedded ghoztty-agent into release bundle."

      - name: Codesign app bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12

          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain

          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime "macos/build/ReleaseLocal/Ghoztty.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime "macos/build/ReleaseLocal/Ghoztty.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime "macos/build/ReleaseLocal/Ghoztty.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime "macos/build/ReleaseLocal/Ghoztty.app/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime "macos/build/ReleaseLocal/Ghoztty.app/Contents/Frameworks/Sparkle.framework"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime "macos/build/ReleaseLocal/Ghoztty.app/Contents/PlugIns/DockTilePlugin.plugin"
          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime "macos/build/ReleaseLocal/Ghoztty.app/Contents/MacOS/ghoztty-agent"

          /usr/bin/codesign --verbose -f -s "$MACOS_CERTIFICATE_NAME" -o runtime --entitlements "macos/Ghostty.entitlements" macos/build/ReleaseLocal/Ghoztty.app

          # Strict verify of the sealed bundle (covers the nested agent) so a
          # broken seal fails here instead of at notarization.
          /usr/bin/codesign --verify --deep --strict --verbose=2 "macos/build/ReleaseLocal/Ghoztty.app"

          test -x "macos/build/ReleaseLocal/Ghoztty.app/Contents/MacOS/ghoztty-agent" || { echo "::error::ghoztty-agent missing from signed bundle"; exit 1; }

      - name: Create DMG
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          npm install --global create-dmg
          create-dmg \
            --identity="$MACOS_CERTIFICATE_NAME" \
            ./macos/build/ReleaseLocal/Ghoztty.app \
            ./
          mv ./*.dmg "./$DMG_NAME"

      - name: Notarize DMG
        env:
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        run: |
          echo "$APPLE_NOTARIZATION_KEY" > notarization_key.p8
          xcrun notarytool store-credentials "notarytool-profile" --key notarization_key.p8 --key-id "$APPLE_NOTARIZATION_KEY_ID" --issuer "$APPLE_NOTARIZATION_ISSUER"
          rm notarization_key.p8

          xcrun notarytool submit "$DMG_NAME" --keychain-profile "notarytool-profile" --wait

          xcrun stapler staple "$DMG_NAME"
          xcrun stapler staple "macos/build/ReleaseLocal/Ghoztty.app"

      - name: Download Sparkle tools
        run: |
          curl -L -o /tmp/Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/2.9.0/Sparkle-2.9.0.tar.xz"
          mkdir -p /tmp/sparkle
          tar xf /tmp/Sparkle.tar.xz -C /tmp/sparkle

      - name: Sign DMG with Sparkle EdDSA key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_OUTPUT=$(echo "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle/bin/sign_update "$DMG_NAME" --ed-key-file -)
          echo "SPARKLE_SIGN_OUTPUT=$SIGN_OUTPUT" >> $GITHUB_ENV
          DMG_LENGTH=$(stat -f%z "$DMG_NAME")
          echo "DMG_LENGTH=$DMG_LENGTH" >> $GITHUB_ENV

      # Keep the signed, notarized DMG even if publishing below fails. Without
      # this the runner's copy is the only one, so a transient API failure threw
      # away a ~6 minute build + notarization and forced a full rebuild. With it,
      # a failed publish is recoverable by hand:
      #   gh run download <run-id> -n dmg && gh release create v<x.y.z> *.dmg
      - name: Keep the DMG as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: ${{ env.DMG_NAME }}
          if-no-files-found: error
          retention-days: 14

      # Publish with `gh` and an explicit backoff rather than
      # softprops/action-gh-release, which classifies EVERY 403 as a permissions
      # problem ("Skip retry - your GitHub token/PAT does not have the required
      # permission") and gives up. The 403 we actually hit is
      # "API rate limit exceeded for installation" - the shared 5,000/hr bucket
      # that the scheduled Clean Artifacts job can drain - which is retryable,
      # and is the single thing most likely to fail a release.
      #
      # Idempotent on purpose, so a re-run of a partially-successful job is safe:
      # the release is created only if absent, and the asset is --clobber'd.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          publish() {
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG already exists; uploading asset."
            else
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Ghoztty $TAG" \
                --notes "Custom Ghoztty build (macOS ${ARCH}, signed and notarized)." \
                || return 1
            fi
            gh release upload "$TAG" "$DMG_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber
          }

          # ~17 minutes of total patience, which covers a drained installation
          # bucket refilling on its rolling hour.
          for delay in 0 30 60 120 240 300 300; do
            if [ "$delay" != 0 ]; then
              # If we are rate limited, prefer sleeping until the real reset.
              reset=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || echo "")
              if [ -n "$reset" ]; then
                now=$(date -u +%s)
                until_reset=$(( reset - now ))
                if [ "$until_reset" -gt 0 ] && [ "$until_reset" -lt 900 ]; then
                  delay=$(( until_reset + 15 ))
                fi
              fi
              echo "::warning::Publish failed; retrying in ${delay}s"
              sleep "$delay"
            fi
            if publish; then
              echo "Published $TAG"
              exit 0
            fi
          done

          echo "::error::Could not publish $TAG after repeated attempts. The DMG is kept as the 'dmg' artifact on this run - download it and publish by hand, or re-run this workflow via workflow_dispatch."
          exit 1

      - name: Update appcast and deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOWNLOAD_URL="https://github.com/dzearing/ghoztty/releases/download/v${VERSION}/${DMG_NAME}"
          PUB_DATE=$(date -u '+%a, %d %b %Y %H:%M:%S %z')

          ED_SIGNATURE=$(echo "$SPARKLE_SIGN_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/dzearing/ghoztty.git"
          git clone --branch gh-pages --single-branch "$REPO_URL" /tmp/gh-pages
          cd /tmp/gh-pages

          CLIENT_NOTES="$GITHUB_WORKSPACE/release-notes/client/${VERSION}.json"
          python3 - "$VERSION" "$DOWNLOAD_URL" "$ED_SIGNATURE" "$DMG_LENGTH" "$PUB_DATE" "$CLIENT_NOTES" <<'PYEOF'
          import sys, os, xml.etree.ElementTree as ET

          version, url, sig, length, pub_date, client_notes_path = sys.argv[1:7]

          ns = {"sparkle": "http://www.andymatuschak.net/xml-namespaces/sparkle"}
          ET.register_namespace("sparkle", ns["sparkle"])
          ET.register_namespace("dc", "http://purl.org/dc/elements/1.1/")

          tree = ET.parse("appcast.xml")
          channel = tree.find("channel")

          # Idempotent: a re-run (or a dispatch re-release) must REPLACE this
          # version's entry, never append a second one. A rebuilt DMG has a new
          # signature and length, so the newest write is the correct one.
          for existing in channel.findall("item"):
              v = existing.find("{%s}version" % ns["sparkle"])
              if v is not None and (v.text or "").strip() == version:
                  channel.remove(existing)

          item = ET.SubElement(channel, "item")
          ET.SubElement(item, "title").text = f"Version {version}"
          ET.SubElement(item, "{%s}version" % ns["sparkle"]).text = version
          ET.SubElement(item, "{%s}shortVersionString" % ns["sparkle"]).text = version
          ET.SubElement(item, "pubDate").text = pub_date

          if client_notes_path and os.path.isfile(client_notes_path):
              with open(client_notes_path, "r", encoding="utf-8") as f:
                  ET.SubElement(item, "description").text = f.read()

          enclosure = ET.SubElement(item, "enclosure")
          enclosure.set("url", url)
          enclosure.set("type", "application/octet-stream")
          enclosure.set("{%s}edSignature" % ns["sparkle"], sig)
          enclosure.set("length", length)

          ET.indent(tree, space="    ")
          tree.write("appcast.xml", xml_declaration=True, encoding="utf-8")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml

          # A re-run whose appcast edit is byte-identical has nothing to
          # commit, and `git commit` exits non-zero on that - which under
          # bash -e would fail a release that is already fully published.
          if git diff --cached --quiet; then
            echo "Appcast already up to date for v${VERSION}"
            exit 0
          fi
          git commit -m "Update appcast for v${VERSION}"

          # release-windows.yml also writes index.html on this branch from the
          # same tag push (T39), so this push has two concurrent writers.
          # gh-pages also carries the website version bump, so a release can
          # race a human push and lose on a non-fast-forward. Rebase and retry
          # rather than failing the job after the release is already public.
          for attempt in 1 2 3 4 5; do
            if git push origin gh-pages; then
              echo "Appcast pushed"
              exit 0
            fi
            echo "::warning::gh-pages push rejected (attempt ${attempt}); rebasing"
            git pull --rebase origin gh-pages || exit 1
            sleep 5
          done

          echo "::error::Could not push the appcast to gh-pages"
          exit 1
